<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Accueil — cycle d'observation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#FFFFFF;color:#1C1C1C;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
a{color:#1C1C1C}a:hover{color:#000000}
:focus-visible{outline:2px solid #1C1C1C;outline-offset:2px}
</style>
</helmet>
<div style="width: 360px; height: 960px; position: relative; box-sizing: border-box; background: #FFFFFF; font-variant-numeric: tabular-nums; overflow: hidden">

<header style="box-sizing: border-box; padding: 12px 16px 28px; background: linear-gradient(180deg, #E4E1FC 0%, #D4EAFF 72%, #FFFFFF 100%); display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 13px; font-weight: 500; color: #2A2F4A">25 sept. → 24 oct.</span>
<a href="Parametres.dc.html" aria-label="Paramètres" style="width: 44px; height: 44px; margin-right: -10px; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
</a>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 15px; font-weight: 500; color: #2A2F4A">Tu as dépensé</h1>
<span style="font-size: 52px; font-weight: 600; letter-spacing: -0.035em; line-height: 60px">399,90&nbsp;€</span>
<span style="font-size: 14px; color: #2A2F4A">en 18 jours · 12 jours restants</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; align-items: flex-start">
<span style="display: flex; align-items: center; gap: 6px; padding: 6px 12px 6px 8px; border-radius: 16px; background: rgba(255,255,255,0.75); color: #3A3270; font-size: 13px; font-weight: 600">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
Cycle d'observation</span>
<span style="font-size: 13px; color: #2A2F4A">Plafonds proposés le 24 oct.</span>
</div>
</header>

<main style="box-sizing: border-box; padding: 4px 16px 96px; display: flex; flex-direction: column; gap: 28px">
<section aria-labelledby="h-todo">
<h2 id="h-todo" style="margin: 0 0 4px; font-size: 15px; font-weight: 600">À faire</h2>
<div style="min-height: 64px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #EEF1F5">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2" stroke-dasharray="3 2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
<span style="font-size: 14px; font-weight: 500; flex-grow: 1">3 journées non renseignées</span>
<a href="Historique.dc.html" style="height: 44px; padding: 0 14px; border: 1px solid #C9D0D9; border-radius: 22px; display: flex; align-items: center; font-size: 13px; font-weight: 600; text-decoration: none">Compléter</a>
</div>
</section>

<section aria-labelledby="h-cat">
<h2 id="h-cat" style="margin: 0 0 4px; font-size: 15px; font-weight: 600">Par catégorie</h2>
<ul style="margin: 0; padding: 0; list-style: none">
<sc-for list="{{ cats }}" as="c" hint-placeholder-count="6">
<li style="padding: 12px 0; display: flex; gap: 12px; border-bottom: 1px solid #EEF1F5">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><path d="{{ c.d }}"/></svg>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 14px; font-weight: 500">{{ c.label }} <span style="font-weight: 400; color: #5B6068">· {{ c.pct }}</span></span>
<span style="font-size: 14px; font-weight: 600">{{ c.amount }}</span>
</div>
<div aria-hidden="true" style="height: 4px; border-radius: 2px; background: #EDF0F4"><div style="height: 4px; border-radius: 2px; width: {{ c.w }}; background: #5B55B8"></div></div>
</div>
</li>
</sc-for>
</ul>
</section>
</main>

<nav aria-label="Navigation principale" style="position: absolute; left: 0; bottom: 0; width: 360px; height: 72px; box-sizing: border-box; background: #FFFFFF; border-top: 1px solid #E6EAF0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
<a href="Observation.dc.html" aria-current="page" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #1C1C1C; font-size: 11px; font-weight: 600">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg>Accueil</a>
<a href="Historique.dc.html" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B6068; font-size: 11px">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Historique</a>
<div style="display: flex; justify-content: center">
<a href="Saisie.dc.html" aria-label="Ajouter une dépense" style="width: 56px; height: 56px; margin-top: -18px; border-radius: 28px; background: linear-gradient(135deg, #2F3540, #1C1C1C); box-shadow: 0 10px 20px -8px rgba(28,28,28,0.55); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></a>
</div>
<a href="AnalyseVide.dc.html" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B6068; font-size: 11px">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 19v-7M12 19V5M19 19v-10"/></svg>Analyse</a>
<a href="Budget.dc.html" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B6068; font-size: 11px">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 14.5h2"/></svg>Budget</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const nb = ' ';
    const data = [
      ['Courses', 142.3, 36, 'M3 4h2l2 11h11l2-8H6.2M9 19h.01M17 19h.01'],
      ['Loisirs', 95, 24, 'M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4zM14 8v1.5M14 11.25v1.5M14 14.5V16'],
      ['Restaurants', 64.5, 16, 'M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2 1-3 3-3 6v4h3'],
      ['Shopping', 47.9, 12, 'M6 8h12l-1 12H7zM9 8a3 3 0 0 1 6 0'],
      ['Transports', 38.2, 9, 'M7 4h10a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM5 11h14M8 20l1-3M16 20l-1-3'],
      ['Santé', 12, 3, 'M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z']
    ];
    return {
      cats: data.map(([label, v, p, d]) => ({
        label, d, pct: p + ' %',
        amount: v.toFixed(2).replace('.', ',') + nb + '€',
        w: (v / 142.3 * 100).toFixed(1) + '%'
      }))
    };
  }
}
</script>
</body>
</html>
