name: Release

# Se déclenche quand un tag de version est poussé (ex. git push origin v0.7.0)
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: APK signé
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 manquant : la release ne peut pas être signée."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Tests et APK release
        env:
          WF_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          WF_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          WF_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          WF_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "WalletFlow-${GITHUB_REF_NAME}.apk"

      - name: Publication sur GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: WalletFlow-${{ github.ref_name }}.apk
          generate_release_notes: true

      - name: Mapping R8 (pour décoder les crashs)
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Nettoyage de la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
